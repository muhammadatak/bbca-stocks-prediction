global:
  scrape_interval: 15s

# ── Alert Rules ──────────────────────────────────────────
rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - localhost:9090

  - job_name: "fastapi"
    metrics_path: /metrics
    static_configs:
      - targets:
          - fastapi:8000

  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets:
          - pushgateway:9091