# ── Closed-Loop MLOps: Retraining Pipeline ───────────────
# Dipanggil oleh webhook saat alert Prometheus/Grafana menyala
# (Scenario A: Performance-based, Scenario B: Data-drift)
# Juga dipanggil manual (workflow_dispatch) untuk testing.

name: Retrain on Alert

on:
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: "Alasan retrain"
        required: true
        default: "manual"
        type: choice
        options:
          - manual
          - performance_drop
          - data_drift

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup DVC
        run: |
          pip install dvc[s3]

      - name: Pull latest data from DVC
        run: dvc pull data/raw/data.csv.dvc
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Install dependencies
        run: pip install -e .

      - name: Run preprocessing
        run: python src/preprocess.py

      - name: Check data drift (Scenario B)
        if: inputs.trigger_reason == 'data_drift' || inputs.trigger_reason == 'manual'
        run: |
          python src/drift_detector.py || echo "DRIFT_CONFIRMED=true" >> $GITHUB_ENV

      - name: Run training
        run: python src/train.py

      - name: Evaluate & Register
        run: python src/evaluate_register.py

      - name: Push metrics to Pushgateway
        run: python src/evaluate_register.py
