# ── Closed-Loop MLOps: Retraining Pipeline ───────────────
# Trigger: Manual atau via GitHub API (repository_dispatch).
# Alert Prometheus → Webhook → GitHub API → workflow ini.

name: Retrain on Alert

on:
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: "Alasan retrain"
        required: true
        default: "manual"
        type: choice
        options:
          - manual
          - performance_drop
          - data_drift

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e .

      - name: Preprocess (pakai raw data)
        run: python src/preprocess.py

      - name: Run training
        run: python src/train.py

      - name: Evaluate & Register
        run: python src/evaluate_register.py
