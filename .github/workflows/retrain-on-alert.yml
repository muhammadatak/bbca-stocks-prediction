# ── Closed-Loop MLOps: Retraining Pipeline ───────────────
# Trigger: Manual atau via GitHub API (repository_dispatch).
# Alert Prometheus → Webhook → GitHub API → workflow ini.

name: Retrain on Alert

on:
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: "Alasan retrain"
        required: true
        default: "manual"
        type: choice
        options:
          - manual
          - performance_drop
          - data_drift

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e .

      - name: Start MLflow server
        run: |
          export MLFLOW_ALLOW_FILE_STORE=true
          mlflow server --host 127.0.0.1 --port 5000 \
            --backend-store-uri file:./mlruns \
            --artifacts-destination file:./mlruns &
          sleep 5
          curl -s http://127.0.0.1:5000/health || echo "Waiting..."
          sleep 2

      - name: Preprocess
        run: python src/preprocess.py

      - name: Run training
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
          MLFLOW_ALLOW_FILE_STORE: true
        run: python src/train.py

      - name: Evaluate & Register
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
          MLFLOW_ALLOW_FILE_STORE: true
        run: python src/evaluate_register.py
