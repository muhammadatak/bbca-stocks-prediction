services:
  

  # ── MLflow Tracking Server ────────────────────────────
  mlflow:
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    container_name: mlflow-server
    restart: unless-stopped
    environment:
      MLFLOW_ARTIFACT_ROOT: /mlflow-artifacts
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri file:/mlruns
      --artifacts-destination file:/mlruns
    volumes:
      - ./mlruns:/mlruns
    ports:
      - "5000:5000"
    networks:
      - ml-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
  

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fastapi
    networks:
      - ml-network
    

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    networks:
      - ml-network

  pushgateway:
    image: prom/pushgateway:latest
    restart: unless-stopped
    ports:
      - "9091:9091"
    networks:
      - ml-network

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    networks:
      - ml-network

  webhook:
    build:
      context: .
      dockerfile: app/DockerFile
    restart: unless-stopped
    command: python -m uvicorn src.webhook_server:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    networks:
      - ml-network

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - ml-network
    volumes:
      - grafana_data:/var/lib/grafana
  # ── FastAPI Prediction Service ───────────────────────
  fastapi:
    build:
      context: .
      dockerfile: app/DockerFile
    restart: unless-stopped
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: ${MODEL_NAME:-bbca-xgboost-predictor}
      MODEL_ALIAS: ${MODEL_ALIAS:-champion}
      TICKER: ${TICKER:-BBCA.JK}
    ports:
      - "8000"
    networks:
      - ml-network

volumes:
  grafana_data:

networks:
  ml-network:
    driver: bridge

