services:
  # ── PostgreSQL (MLflow backend store) ─────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mlflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlflow} -d ${POSTGRES_DB:-mlflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ml-network

  # ── MLflow Tracking Server ────────────────────────────
  mlflow:
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    container_name: mlflow-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow_secret}@postgres:5432/${POSTGRES_DB:-mlflow}
      MLFLOW_ARTIFACT_ROOT: /mlflow-artifacts
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow_secret}@postgres:5432/${POSTGRES_DB:-mlflow}
      --artifacts-destination /mlflow-artifacts
      --serve-artifacts
    volumes:
      - mlflow_artifacts:/mlflow-artifacts
    ports:
      - "5000:5000"
    networks:
      - ml-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── FastAPI Prediction Service ───────────────────────
  fastapi:
    build:
      context: .
      dockerfile: app/DockerFile
    container_name: stocks-fastapi
    restart: unless-stopped
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: ${MODEL_NAME:-bbca-xgboost-predictor}
      MODEL_ALIAS: ${MODEL_ALIAS:-champion}
      TICKER: ${TICKER:-BBCA.JK}
    ports:
      - "8000:8000"
    networks:
      - ml-network

volumes:
  postgres_data:
  mlflow_artifacts:

networks:
  ml-network:
    driver: bridge
